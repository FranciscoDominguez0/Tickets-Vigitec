server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 35M;

    # Extraer la IP real del cliente que nos pasa un reverse proxy (NPM, Cloudflare, etc.)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param HTTPS $http_x_forwarded_proto_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180s;
    }

    # Bloquear archivos sensibles (.env, .git, logs, archivos de dependencias)
    location ~ /\.(?!well-known).* {
        return 404;
    }

    location ~* /(composer\.(json|lock)|package\.json|package-lock\.json|phpunit\.xml|.*\.log)$ {
        return 404;
    }
}

