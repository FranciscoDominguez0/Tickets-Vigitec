services:

  db:
    image: mysql:8.0
    container_name: tickets_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tickets_laravel}
      MYSQL_USER: ${DB_USERNAME:-tickets_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-12345678}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-12345678}
    volumes:
      - tickets_db_data:/var/lib/mysql
    ports:
      # Puerto alejado para no colisionar con MySQL local (3306)
      - "127.0.0.1:${DB_PORT_EXTERNAL:-33068}:3306"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: tickets-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickets_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Puerto HTTP alejado para pruebas (ej: http://IP_SERVIDOR:8088)
      - "${APP_PORT:-8088}:80"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - tickets_storage:/var/www/html/storage/app
      - tickets_logs:/var/www/html/storage/logs
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  tickets_db_data:
  tickets_storage:
  tickets_logs:

